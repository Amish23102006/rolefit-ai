services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes: ["rolefit-data:/data"]
    environment:
      ROLEFIT_DB_PATH: /data/rolefit.db
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  ui:
    build: ./ui
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp", "/home/app"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  rolefit-data:
